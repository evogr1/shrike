name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check shrike tests
      - run: coverage run -m unittest discover -s tests -t .
      - run: coverage report --fail-under=85 --include=shrike/gsc.py,shrike/coverage.py,shrike/backup.py,shrike/db.py,shrike/health.py,shrike/opps.py,shrike/fixes.py
