[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shrike"
version = "0.1.0"
description = "Free, self-hosted Search Console history, opportunities and weekly fix briefs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "google-auth==2.62.2",
  "google-api-python-client==2.202.0",
  "requests==2.34.2",
]

[project.scripts]
shrike = "shrike.jobs:main"

[tool.setuptools]
packages = ["shrike", "shrike.migrations"]

[tool.setuptools.package-data]
"shrike.migrations" = ["*.sql"]

[tool.ruff]
line-length = 135
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
